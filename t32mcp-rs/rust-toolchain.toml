# Keep this in sync with ../rust-toolchain.toml and CI's RUST_IMAGE.
# Both repository-root package builds and direct crate builds use this version.
# Cross targets are not listed so local builds don't download them all.
# To add a target: `rustup target add <target>`.
[toolchain]
channel = "1.96.0"
components = ["clippy", "rustfmt"]
