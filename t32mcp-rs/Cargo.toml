[package]
name = "t32mcp"
version = "0.3.0"
license = "Apache-2.0"
edition = "2024"

[build-dependencies]
bindgen = "0.72.1"
serde_json = "1.0.151"
schemars = "0.8.22"
typify = "0.8.0"
rustfmt-wrapper = "0.2.1"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
interprocess = { version = "2.4.2", features = ["tokio"] }
tiny_http = "0.12.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
anyhow = "1.0"
rand = { version = "0.10", features = ["std"] }
schemars = "1.2"
sha2 = "0.10"
tempfile = "3.27.0"
tokio = { version = "1.53", features = ["macros", "rt", "time", "net", "io-util"] }
