# Inputs for a manually started release pipeline ("Run pipeline" form, or
# `glab ci run --input release_version:v0.4.0`). The defaults are what push and
# MR pipelines get: no version, so no release job is even created.
spec:
  inputs:
    release_version:
      description: "Version to release, e.g. v0.4.0. Leave empty for a normal pipeline (no release)."
      default: ""
      regex: ^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)?$
    release_dry_run:
      description: "Build and verify the release only: nothing is uploaded, tagged or released."
      type: boolean
      default: false
---
# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence

stages:
  - test
  - build
  - release

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# A release is cut by manually running a pipeline on the default branch with
# the release_version input set (e.g. v0.1.0). The release job creates the tag
# only after the build succeeds. Tick release_dry_run to test the release
# pipeline on any branch: verify + build run, but nothing is uploaded, tagged
# or released (see ci/README.md). Block pipelines for tag refs so the tag
# created by that job does not start a second, redundant pipeline.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # Release pipeline: the SAST/secret-detection scans already ran on the push
    # that landed this commit, so disable them here via the templates' own
    # *_DISABLED switches. Only verify:release + build + release run.
    - if: $RELEASE_VERSION
      variables:
        SAST_DISABLED: "true"
        SECRET_DETECTION_DISABLED: "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  SECRET_DETECTION_ENABLED: 'true'
  # The jobs read the inputs through these. An empty RELEASE_VERSION counts as
  # unset in `rules: if: $RELEASE_VERSION`, so the release jobs are skipped.
  # Combined with && it does not: there an empty but defined variable is true,
  # so write `$RELEASE_VERSION != "" && ...` instead.
  RELEASE_VERSION: "$[[ inputs.release_version ]]"
  RELEASE_DRY_RUN: "$[[ inputs.release_dry_run ]]"
  # Existing upstream Rust images supply nextest and the simulator. This native
  # fork installs bindgen dependencies in before_script until its own images
  # are published. The default Python image is public and runs offline tests.
  RUST_TEST_IMAGE: 'registry.gitlab.com/lauterbach/t32mcp/ci/rust-test:1.96.0-t32-2026.02-r1'
  RUST_IMAGE: 'registry.gitlab.com/lauterbach/t32mcp/ci/rust:1.96.0-t32-2026.02-r2'
  PYTEST_IMAGE: 'ghcr.io/astral-sh/uv:python3.14-bookworm-slim'
  UV_NO_ENV_FILE: '1'
  # Keep cargo + xwin downloads inside the project dir so they can be cached.
  CARGO_HOME: '$CI_PROJECT_DIR/.cargo'
  XWIN_CACHE_DIR: '$CI_PROJECT_DIR/.xwin-cache'
  # Keep target/ small for the cache: incremental data is useless after a fresh
  # checkout (~40% of a debug target dir), and line tables suffice for
  # backtraces. Release builds are not affected by either.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Only pipelines on the default branch write the caches; all others only read
  # them, which saves the upload. Set it to pull-push when starting a pipeline
  # by hand to seed new caches from a branch (see ci/README.md).
  CARGO_CACHE_POLICY: pull

# Cargo cache, one per job so the target dirs don't clobber each other. Keyed on
# the lockfile and toolchain, so a dependency or Rust update starts a fresh
# cache instead of piling up stale artifacts in it.
.cargo-cache: &cargo-cache
  key:
    prefix: "cargo-$CI_JOB_NAME"
    files:
      - t32mcp-rs/Cargo.lock
      - t32mcp-rs/rust-toolchain.toml
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - t32mcp-rs/target/
  policy: $CARGO_CACHE_POLICY

sast:
  stage: test

secret_detection:
  stage: test

# ---------------------------------------------------------------------------
# Checks (run on every push and on tags)
# ---------------------------------------------------------------------------

# Shared settings for the lint/test jobs. The crate lives in t32mcp-rs/.
.rust-check:
  stage: test
  image: $RUST_TEST_IMAGE
  rules:
    # Skip lint/test in the release pipeline; they already ran on the push that
    # landed this commit. The build is gated on verify:release instead.
    - if: $RELEASE_VERSION
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CARGO_CACHE_POLICY: pull-push
    - if: $CI_COMMIT_BRANCH
  cache: *cargo-cache
  before_script:
    # Existing upstream images do not contain the native fork's bindgen tools.
    - &install-native-deps apt-get update && apt-get install -y --no-install-recommends clang libclang-dev
clippy:
  extends: .rust-check
  script:
    - cd t32mcp-rs
    # --keep-going keeps compiling lib/bin/tests after the first failure so a
    # single run reports every lint instead of one-per-pipeline.
    - cargo clippy --locked --all-targets --all-features --keep-going -- -D warnings

# Runs all Rust tests, with a JUnit report for GitLab. The integration tests in
# tests/ talk to the TRACE32 simulator of the image, started by start_sim.sh.
test:
  extends: .rust-check
  variables:
    # This isolated job explicitly authorizes its own simulator only.
    T32MCP_HARDWARE: "1"
    T32MCP_T32_PORT: "20000"
  before_script:
    - *install-native-deps
    - ci/start_sim.sh
  script:
    - cd t32mcp-rs
    - cargo build --locked
    - cargo nextest run --locked --profile ci
  artifacts:
    # The debug binary is only needed to hand it to test:integration; not a
    # release artifact. The report is uploaded also when the tests fail.
    when: always
    expire_in: 1h
    paths:
      - t32mcp-rs/target/debug/t32mcp
    reports:
      junit: t32mcp-rs/target/nextest/ci/junit.xml

# Runs the Python integration tests (tests/) against the debug binary built by
# `test`. Hardware tests are disabled by default, even with T32SYS set.
# An explicitly selected custom Python 3.14 simulator image can opt in using
# T32MCP_HARDWARE=1 and an explicit T32MCP_T32_PORT (see ci/README.md).
test:integration:
  extends: .rust-check
  image: $PYTEST_IMAGE
  needs:
    - test
  cache: []
  before_script: []
  variables:
    # uv's cache and the venv are on different filesystems, so it copies anyway;
    # this only silences its hardlink warning.
    UV_LINK_MODE: copy
  script:
    - cd tests
    # JUnit XML feeds GitLab's test report (pipeline "Tests" tab, MR widget).
    - uv run --no-env-file --locked pytest --junitxml=report.xml
  artifacts:
    # Also on failure, which is when the report matters most.
    when: always
    expire_in: 1 week
    reports:
      junit: tests/report.xml

# Compile-only checks of the supported native release cross targets. These do
# not replace linking the bundled vendor libraries in the release builds.
check:cross:
  extends: .rust-check
  image: $RUST_IMAGE
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends clang libclang-dev llvm lld
  script:
    - cd t32mcp-rs
    - rustup target add aarch64-unknown-linux-gnu x86_64-pc-windows-msvc
    - cargo check --locked --target aarch64-unknown-linux-gnu
    # Match the Windows SDK environment of the release build.
    - cargo xwin check --locked --target x86_64-pc-windows-msvc

# Release gate: only present when a release is requested via release_version.
# Runs in the first stage so a version mismatch or missing CHANGELOG section
# fails fast, before the expensive cross-compile builds.
verify:release:
  stage: test
  image: alpine:latest
  rules:
    - if: $RELEASE_VERSION
  script:
    # Real releases only come from the default branch; other branches must
    # opt into a dry run.
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ] && [ "$RELEASE_DRY_RUN" != "true" ]; then
        echo "ERROR: releases are only allowed from $CI_DEFAULT_BRANCH (got: $CI_COMMIT_BRANCH)." >&2
        echo "Tick the release_dry_run input to test the release pipeline on this branch." >&2
        exit 1
      fi
    - sh ci/check_version.sh "$RELEASE_VERSION"
    - sh ci/extract_changelog.sh "$RELEASE_VERSION" > /dev/null

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

# Shared settings for the Rust build jobs. The crate lives in t32mcp-rs/.
.rust-build:
  stage: build
  image: $RUST_IMAGE
  # Gate the build on the release check only: if verify:release fails, no build
  # starts. (clippy/test/security are skipped in the release pipeline.)
  needs:
    - verify:release
  cache: *cargo-cache
  before_script:
    - *install-native-deps
  rules:
    # Builds only feed the release, so run them only when a release is requested
    # (manual pipeline with release_version set). rust-toolchain.toml pins the
    # same toolchain as CI, so a local build matches the release build.
    - if: $RELEASE_VERSION != "" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CARGO_CACHE_POLICY: pull-push
    - if: $RELEASE_VERSION
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - dist/
    expire_in: 1 week

build:linux:
  extends: .rust-build
  script:
    - cd t32mcp-rs
    - cargo build --locked --release
    - mkdir -p "$CI_PROJECT_DIR/dist"
    - cp target/release/t32mcp "$CI_PROJECT_DIR/dist/t32mcp-linux-x86_64"

build:linux-arm64:
  extends: .rust-build
  before_script:
    # gcc-aarch64-linux-gnu + the cross glibc headers are the actual aarch64
    # toolchain; the linker itself is configured in t32mcp-rs/.cargo/config.toml.
    - apt-get update && apt-get install -y --no-install-recommends clang libclang-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    - rustup target add aarch64-unknown-linux-gnu
  script:
    - cd t32mcp-rs
    - cargo build --locked --release --target aarch64-unknown-linux-gnu
    - mkdir -p "$CI_PROJECT_DIR/dist"
    - cp target/aarch64-unknown-linux-gnu/release/t32mcp "$CI_PROJECT_DIR/dist/t32mcp-linux-aarch64"

build:windows:
  extends: .rust-build
  cache:
    - *cargo-cache
    # The Windows CRT/SDK that cargo-xwin downloads. It only changes with the
    # cargo-xwin version, which ci/Dockerfile pins.
    - key:
        prefix: xwin
        files:
          - ci/Dockerfile
      paths:
        - .xwin-cache/
      policy: $CARGO_CACHE_POLICY
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends clang libclang-dev llvm lld
    - rustup target add x86_64-pc-windows-msvc
  script:
    - cd t32mcp-rs
    - cargo xwin build --locked --release --target x86_64-pc-windows-msvc
    - mkdir -p "$CI_PROJECT_DIR/dist"
    - cp target/x86_64-pc-windows-msvc/release/t32mcp.exe "$CI_PROJECT_DIR/dist/t32mcp-windows-x86_64.exe"

# Bundle the TRACE32 skill directory as a zip release artifact.
package:skill:
  stage: build
  image: alpine:latest
  needs:
    - verify:release
  rules:
    - if: $RELEASE_VERSION
  before_script:
    - apk add --no-cache zip
  script:
    - mkdir -p dist
    - zip -r "$CI_PROJECT_DIR/dist/skills.zip" skills
  artifacts:
    name: skills
    paths:
      - dist/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Release (manual pipeline on the default branch with release_version set)
# ---------------------------------------------------------------------------

# Stand-in for upload + release when release_dry_run is ticked: checks that all
# release files were built and that the release notes render, without
# touching the package registry or creating a tag/release.
release:dry-run:
  stage: release
  image: alpine:latest
  rules:
    - if: $RELEASE_VERSION != "" && $RELEASE_DRY_RUN == "true"
  needs:
    - build:linux
    - build:linux-arm64
    - build:windows
    - package:skill
  script:
    - ls -l dist/
    - test -f dist/t32mcp-linux-x86_64
    - test -f dist/t32mcp-linux-aarch64
    - test -f dist/t32mcp-windows-x86_64.exe
    - test -f dist/skills.zip
    - sh ci/extract_changelog.sh "$RELEASE_VERSION" > release_notes.md
    - echo "Release notes for $RELEASE_VERSION:" && cat release_notes.md

# Upload the built binaries to the project's Generic Package Registry.
upload:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $RELEASE_VERSION != "" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_DRY_RUN != "true"
  needs:
    - build:linux
    - build:linux-arm64
    - build:windows
    - package:skill
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/t32mcp/${RELEASE_VERSION}"
  script:
    - |
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file dist/t32mcp-linux-x86_64 \
        "${PACKAGE_REGISTRY_URL}/t32mcp-linux-x86_64"
    - |
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file dist/t32mcp-linux-aarch64 \
        "${PACKAGE_REGISTRY_URL}/t32mcp-linux-aarch64"
    - |
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file dist/t32mcp-windows-x86_64.exe \
        "${PACKAGE_REGISTRY_URL}/t32mcp-windows-x86_64.exe"
    - |
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file dist/skills.zip \
        "${PACKAGE_REGISTRY_URL}/skills.zip"

# Create the git tag and the GitLab Release, but only after the build and
# upload jobs succeed, so a failed build never leaves a dangling tag. release-cli
# creates the tag from CI_COMMIT_SHA using the built-in CI_JOB_TOKEN, so no
# personal/project access token is needed. Tag pipelines are disabled in the
# workflow rules, so creating the tag does not start another pipeline.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $RELEASE_VERSION != "" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_DRY_RUN != "true"
  needs:
    - upload
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/t32mcp/${RELEASE_VERSION}"
  script:
    # Release notes from CHANGELOG.md; exits non-zero if the section is missing.
    - sh ci/extract_changelog.sh "$RELEASE_VERSION" > release_notes.md
    - echo "Release notes for $RELEASE_VERSION:" && cat release_notes.md
  release:
    tag_name: "$RELEASE_VERSION"
    ref: "$CI_COMMIT_SHA"
    name: "t32mcp $RELEASE_VERSION"
    description: release_notes.md
    assets:
      links:
        - name: "t32mcp-linux-x86_64"
          url: "${PACKAGE_REGISTRY_URL}/t32mcp-linux-x86_64"
          link_type: "package"
        - name: "t32mcp-linux-aarch64"
          url: "${PACKAGE_REGISTRY_URL}/t32mcp-linux-aarch64"
          link_type: "package"
        - name: "t32mcp-windows-x86_64.exe"
          url: "${PACKAGE_REGISTRY_URL}/t32mcp-windows-x86_64.exe"
          link_type: "package"
        - name: "skills.zip"
          url: "${PACKAGE_REGISTRY_URL}/skills.zip"
          link_type: "package"
